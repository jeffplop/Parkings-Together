<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parkings Together — API REST (Swagger)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { background: #1f4e79; color: #fff; padding: 14px 22px; font-family: Arial, sans-serif; }
    .topbar h1 { margin: 0; font-size: 18px; }
    .topbar p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Parkings Together — API REST</h1>
    <p>Especificación interactiva de los endpoints (BFF + microservicios). Generada desde <code>openapi.yaml</code>.</p>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: './openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout',
        tryItOutEnabled: true,
      });
    };
  </script>
</body>
</html>
