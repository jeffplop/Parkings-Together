openapi: 3.0.3
info:
  title: Parkings Together — API REST
  version: "1.0.0"
  description: |
    Especificación de los endpoints de **Parkings Together**, un marketplace P2P de
    estacionamientos. La arquitectura sigue el patrón **BFF (Backend for Frontend)**:
    el frontend (`apps/web`) consume rutas de **mismo origen** (`/api/mapas`,
    `/api/reservas`) que orquestan la lógica y la persistencia en Supabase/PostgreSQL.

    Además se documentan los microservicios independientes (`auth`, `ms-mapas`,
    `ms-reservas`), cada uno desplegable por separado, que exponen el mismo dominio
    bajo el prefijo versionado `/api/v1`.

    **Autenticación:** las operaciones de escritura requieren un *Bearer token* JWT
    emitido por Supabase Auth (obtenido en `POST /api/v1/auth/login`). Las políticas
    RLS de PostgreSQL evalúan `auth.uid()` con ese token.
  contact:
    name: Equipo Parkings Together
  license:
    name: Uso académico

servers:
  - url: http://localhost:3000
    description: BFF / Frontend (apps/web)

tags:
  - name: Autenticación
    description: Registro e inicio de sesión (microservicio auth, puerto 3001)
  - name: BFF · Mapas
    description: Estacionamientos vía rutas de mismo origen del frontend (puerto 3000)
  - name: BFF · Reservas
    description: Reservas vía rutas de mismo origen del frontend (puerto 3000)
  - name: MS Mapas
    description: Microservicio de estacionamientos independiente (puerto 3002)
  - name: MS Reservas
    description: Microservicio de reservas independiente (puerto 3003)

paths:
  # ───────────────────────────── AUTH (puerto 3001) ─────────────────────────────
  /api/v1/auth/register:
    servers:
      - url: http://localhost:3001
        description: Microservicio auth
    post:
      tags: [Autenticación]
      summary: Registrar un nuevo usuario
      description: Crea una cuenta en Supabase Auth. Un trigger crea el perfil asociado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: anfitrion@example.com
              password: "secret123"
              nombre: María Pérez
              rol: anfitrion
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              example:
                success: true
                message: Cuenta creada. Revisa tu correo para confirmar.
                user:
                  id: 8f1c2e3a-0000-4a11-9b22-aabbccddeeff
                  email: anfitrion@example.com
                  rol: anfitrion
        '400':
          description: Faltan campos obligatorios o error de registro
          content:
            application/json:
              example: { success: false, error: "Nombre, email, contraseña y rol son obligatorios." }

  /api/v1/auth/login:
    servers:
      - url: http://localhost:3001
        description: Microservicio auth
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Valida credenciales y devuelve el `access_token` (JWT) para las llamadas autenticadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: anfitrion@example.com
              password: "secret123"
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              example:
                success: true
                user:
                  id: 8f1c2e3a-0000-4a11-9b22-aabbccddeeff
                  email: anfitrion@example.com
                  nombre: María Pérez
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Email y contraseña obligatorios
          content:
            application/json:
              example: { success: false, error: "Email y contraseña son obligatorios." }
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              example: { success: false, error: "Credenciales inválidas." }

  # ───────────────────────── BFF · MAPAS (puerto 3000) ─────────────────────────
  /api/mapas/search:
    get:
      tags: [BFF · Mapas]
      summary: Listar / buscar estacionamientos (o el detalle de uno)
      description: |
        Lectura pública (RLS `SELECT USING (true)`). Si se envía `id`, devuelve el
        detalle de **un** estacionamiento (`data` como objeto, no array).

        Búsqueda con `lat` + `lng` + `radius` (sin `userId`): usa la función
        PostGIS `buscar_estacionamientos_radio` (índice GIST, O(log n)) y soporta
        además `q`, `comuna`, `pmr`, `disponible` y `precioMax` como filtros
        server-side (`precioMin` se aplica en memoria sobre el resultado).

        Sin `lat/lng/radius`, o con `userId`: consulta directa a `estacionamientos`
        con los mismos filtros (`q`, `comuna`, `pmr`, `disponible`, `precioMin`,
        `precioMax`) vía SQL/`ilike`, más filtro Haversine en memoria si además se
        envían `lat/lng/radius`.
      parameters:
        - { name: id, in: query, required: false, schema: { type: string, format: uuid }, description: Devuelve el detalle de un solo estacionamiento (data como objeto) }
        - { name: userId, in: query, required: false, schema: { type: string, format: uuid }, description: Filtra por dueño del estacionamiento (incluye inactivos) }
        - { name: lat, in: query, required: false, schema: { type: number }, example: -33.4489 }
        - { name: lng, in: query, required: false, schema: { type: number }, example: -70.6693 }
        - { name: radius, in: query, required: false, schema: { type: number }, description: Radio en km (1..9998), example: 5 }
        - { name: q, in: query, required: false, schema: { type: string }, description: Búsqueda por nombre (ilike) }
        - { name: comuna, in: query, required: false, schema: { type: string }, description: Filtra por comuna (ilike) }
        - { name: pmr, in: query, required: false, schema: { type: string, enum: ["true"] }, description: "Si es 'true', solo estacionamientos con plaza PMR" }
        - { name: disponible, in: query, required: false, schema: { type: string, enum: ["true"] }, description: "Si es 'true', solo estacionamientos con cupos libres (occupied_spots < total_spots)" }
        - { name: precioMin, in: query, required: false, schema: { type: number }, description: Precio por hora mínimo (CLP) }
        - { name: precioMax, in: query, required: false, schema: { type: number }, description: Precio por hora máximo (CLP) }
      responses:
        '200':
          description: Lista de estacionamientos (o detalle si se envía `id`)
          content:
            application/json:
              example:
                success: true
                data:
                  - id: 1a2b3c4d-0000-4f00-8a00-111122223333
                    nombre: Estacionamiento Centro
                    arrendador: María Pérez
                    lat: -33.4489
                    lng: -70.6693
                    total_spots: 10
                    occupied_spots: 3
                    es_pmr: false
                    precio_hora: 1500
                    user_id: 8f1c2e3a-0000-4a11-9b22-aabbccddeeff
        '404':
          description: No existe un estacionamiento con ese `id`
          content:
            application/json:
              example: { success: false, error: "mensaje del backend", data: null }
        '500':
          description: Error de servidor
          content:
            application/json:
              example: { success: false, error: "mensaje del backend", data: [] }
    post:
      tags: [BFF · Mapas]
      summary: Crear un estacionamiento
      description: |
        Requiere JWT. RLS exige rol `anfitrion` y `auth.uid() = user_id`. El
        `user_id` **se obtiene del token**, no del body — cualquier `userId` que
        se envíe en el body es ignorado.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearEstacionamientoRequest' }
            example:
              nombre: Estacionamiento Centro
              arrendador: María Pérez
              lat: -33.4489
              lng: -70.6693
              totalSpots: 10
              esPmr: false
              precioHora: 1500
              comuna: Santiago
              direccion: Av. Siempre Viva 123
      responses:
        '201':
          description: Creado
          content:
            application/json:
              example:
                success: true
                data: { id: 1a2b3c4d-0000-4f00-8a00-111122223333, nombre: Estacionamiento Centro, occupied_spots: 0, total_spots: 10, precio_hora: 1500 }
        '400': { description: Faltan campos obligatorios o lat/lng inválidos, content: { application/json: { example: { success: false, error: "Faltan campos obligatorios: nombre, lat, lng." } } } }
        '401': { description: No autenticado, content: { application/json: { example: { success: false, error: "No autenticado." } } } }
        '403': { description: Rechazado por RLS, content: { application/json: { example: { success: false, error: "new row violates row-level security policy" } } } }
    patch:
      tags: [BFF · Mapas]
      summary: Actualizar un estacionamiento (ocupación, estado activo o edición completa)
      description: |
        Requiere JWT + RLS (`auth.uid() = user_id`). El comportamiento depende del
        campo `action`:
          - **(sin `action`)**: requiere `id` y `occupied_spots` (≥ 0); actualiza
            solo la ocupación.
          - **`action: "toggleActivo"`**: requiere `id`; invierte el flag `activo`
            (publicar/despublicar el estacionamiento). La respuesta incluye además
            `activo`.
          - **`action: "updateFull"`**: requiere `id`; actualiza cualquier
            combinación de `nombre`, `totalSpots`, `esPmr`, `precioHora`,
            `pricePerMinute`, `pricePerDay`, `allowedVehicleTypes`, `photos`,
            `descripcion`, `direccion`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarEstacionamientoRequest' }
            examples:
              ocupacion:
                summary: Actualizar ocupación
                value: { id: 1a2b3c4d-0000-4f00-8a00-111122223333, occupied_spots: 4 }
              toggleActivo:
                summary: Publicar / despublicar
                value: { id: 1a2b3c4d-0000-4f00-8a00-111122223333, action: toggleActivo }
              updateFull:
                summary: Edición completa
                value: { id: 1a2b3c4d-0000-4f00-8a00-111122223333, action: updateFull, nombre: "Estacionamiento Centro 2", precioHora: 1800, esPmr: true }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              example: { success: true, data: { id: 1a2b3c4d-0000-4f00-8a00-111122223333, occupied_spots: 4 } }
        '400':
          description: Falta `id`, o falta/es inválido `occupied_spots` cuando no se envía `action`
          content:
            application/json:
              example: { success: false, error: "Se requiere occupied_spots (>= 0)." }
        '401': { description: No autenticado }
        '403': { description: Rechazado por RLS }
        '404': { description: "No existe un estacionamiento con ese id (modo toggleActivo)" }
    delete:
      tags: [BFF · Mapas]
      summary: Eliminar (o desactivar) uno o varios estacionamientos
      description: |
        Requiere JWT + RLS. Por cada `id`: si tiene reservas activas
        (`pendiente`/`confirmada`/`activa`), se aplica **soft-delete**
        (`activo = false`); si no tiene, se elimina (**hard-delete**).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { ids: { type: array, items: { type: string, format: uuid } } }, required: [ids] }
            example: { ids: ["1a2b3c4d-0000-4f00-8a00-111122223333"] }
      responses:
        '200':
          description: Procesados (eliminados y/o desactivados)
          content:
            application/json:
              example:
                success: true
                hardDeleted: 1
                softDeleted: 0
                hardDeletedIds: ["1a2b3c4d-0000-4f00-8a00-111122223333"]
                softDeletedIds: []
        '400': { description: Se requiere un array de IDs }
        '401': { description: No autenticado }
        '403': { description: Rechazado por RLS }

  # ──────────────────────── BFF · RESERVAS (puerto 3000) ───────────────────────
  /api/reservas/reserve:
    get:
      tags: [BFF · Reservas]
      summary: Verificar disponibilidad de un estacionamiento
      parameters:
        - { name: parkingId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Disponibilidad
          content:
            application/json:
              example:
                success: true
                available: true
                spots_left: 7
                data: { id: 1a2b3c4d-0000-4f00-8a00-111122223333, nombre: Estacionamiento Centro, occupied_spots: 3, total_spots: 10 }
        '400': { description: Falta parkingId, content: { application/json: { example: { success: false, error: "Falta parkingId" } } } }
        '500': { description: Error de servidor }
    post:
      tags: [BFF · Reservas]
      summary: Crear una reserva (instantánea o "PRO" con fecha)
      description: |
        Requiere JWT. Dos modos sobre la misma transacción atómica (RPC
        `SECURITY DEFINER`, anti doble-reserva):

          - **PRO (reserva anticipada)**: si se envían `fecha_inicio`/`fecha_fin`
            (o `duration_hours`, con el que el backend calcula `fecha_fin`), se
            invoca `crear_reserva_pro`, que valida solapamiento de horarios y crea
            la reserva con estado `pendiente` (a confirmar por el arrendador).
          - **Instantánea (legacy)**: sin fechas ni `duration_hours`, se invoca
            `reservar_estacionamiento`, que bloquea la fila (`FOR UPDATE`),
            verifica el cupo, inserta la reserva con estado `activa` e incrementa
            `occupied_spots` — todo en una única transacción.

        Si se envía `spot_label`, se asigna a la reserva creada en un segundo update.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearReservaRequest' }
            examples:
              instantanea:
                summary: Reserva instantánea (estacionar ya)
                value: { parking_id: 1a2b3c4d-0000-4f00-8a00-111122223333, user_id: 8f1c2e3a-0000-4a11-9b22-aabbccddeeff }
              pro:
                summary: Reserva PRO con horario
                value: { parking_id: 1a2b3c4d-0000-4f00-8a00-111122223333, user_id: 8f1c2e3a-0000-4a11-9b22-aabbccddeeff, fecha_inicio: "2026-06-15T10:00:00Z", fecha_fin: "2026-06-15T12:00:00Z", spot_label: "A-12" }
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              example:
                success: true
                reserva: { id: 9z8y7x6w-0000-4c00-8d00-444455556666, estacionamiento_id: 1a2b3c4d-0000-4f00-8a00-111122223333, conductor_id: 8f1c2e3a-0000-4a11-9b22-aabbccddeeff, estado: activa }
        '400':
          description: Faltan `parking_id`/`user_id`, o error de negocio (p.ej. solapamiento de horario en modo PRO)
          content:
            application/json:
              example: { success: false, error: "Faltan parking_id o user_id." }
        '401': { description: No autenticado }
        '409':
          description: Estacionamiento lleno (la transacción se rechaza)
          content:
            application/json:
              example: { success: false, error: "Estacionamiento lleno" }
        '500': { description: Error de servidor }

  # ─────────────────────────── MS MAPAS (puerto 3002) ──────────────────────────
  /api/v1/search:
    servers:
      - url: http://localhost:3002
        description: Microservicio ms-mapas
    get:
      tags: [MS Mapas]
      summary: Listar estacionamientos (microservicio)
      parameters:
        - { name: userId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { example: { success: true, data: [] } } } }
        '500': { description: Error }
    post:
      tags: [MS Mapas]
      summary: Crear estacionamiento (microservicio)
      requestBody:
        required: true
        content:
          application/json:
            example: { nombre: Centro, arrendador: María, lat: -33.44, lng: -70.66, totalSpots: 10, userId: 8f1c2e3a-0000-4a11-9b22-aabbccddeeff }
      responses:
        '201': { description: Creado, content: { application/json: { example: { success: true, data: { id: "uuid", occupied_spots: 0 } } } } }
        '400': { description: Faltan campos obligatorios }
    patch:
      tags: [MS Mapas]
      summary: Actualizar ocupación (microservicio)
      requestBody:
        required: true
        content:
          application/json:
            example: { id: 1a2b3c4d-0000-4f00-8a00-111122223333, occupied_spots: 4 }
      responses:
        '200': { description: Actualizado }
        '400': { description: Se requiere id y occupied_spots }
    delete:
      tags: [MS Mapas]
      summary: Eliminar estacionamientos (microservicio)
      requestBody:
        required: true
        content:
          application/json:
            example: { ids: ["1a2b3c4d-0000-4f00-8a00-111122223333"] }
      responses:
        '200': { description: Eliminados, content: { application/json: { example: { success: true, deleted: 1 } } } }
        '400': { description: Se requiere un array de IDs }

  # ────────────────────────── MS RESERVAS (puerto 3003) ────────────────────────
  /api/v1/reserve:
    servers:
      - url: http://localhost:3003
        description: Microservicio ms-reservas
    get:
      tags: [MS Reservas]
      summary: Verificar disponibilidad (microservicio)
      parameters:
        - { name: parkingId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { example: { available: true, spots_left: 7, data: {} } } } }
        '400': { description: Falta parkingId }
        '500': { description: Error }
    post:
      tags: [MS Reservas]
      summary: Crear reserva — patrón Saga (microservicio)
      description: |
        Implementa el patrón **Saga** en la capa de servicio: crea la reserva,
        incrementa la ocupación y, si esto último falla, **compensa** borrando la
        reserva creada (rollback) para mantener la integridad.
      requestBody:
        required: true
        content:
          application/json:
            example: { parking_id: 1a2b3c4d-0000-4f00-8a00-111122223333, user_id: 8f1c2e3a-0000-4a11-9b22-aabbccddeeff }
      responses:
        '201': { description: Reserva creada, content: { application/json: { example: { success: true, reserva: { id: "uuid", estado: activa } } } } }
        '500': { description: "Saga rechazada (lleno) o compensada (rollback)", content: { application/json: { example: { error: "El estacionamiento ya está lleno. Transacción rechazada." } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de Supabase Auth obtenido en POST /api/v1/auth/login

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RegisterRequest:
      type: object
      required: [email, password, nombre, rol]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        nombre: { type: string }
        rol: { type: string, enum: [cliente, anfitrion] }

    Estacionamiento:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        nombre: { type: string }
        arrendador: { type: string }
        lat: { type: number }
        lng: { type: number }
        total_spots: { type: integer }
        occupied_spots: { type: integer }
        es_pmr: { type: boolean }
        activo: { type: boolean, description: "false = despublicado / soft-deleted" }
        precio_hora: { type: integer, description: CLP }
        price_per_minute: { type: number, description: CLP (opcional) }
        price_per_day: { type: integer, description: CLP (opcional) }
        allowed_vehicle_types: { type: array, items: { type: string } }
        comuna: { type: string }
        descripcion: { type: string }
        direccion: { type: string }
        created_at: { type: string, format: date-time }

    CrearEstacionamientoRequest:
      type: object
      required: [nombre, lat, lng]
      properties:
        nombre: { type: string }
        arrendador: { type: string }
        lat: { type: number }
        lng: { type: number }
        totalSpots: { type: integer, default: 1 }
        esPmr: { type: boolean, default: false }
        precioHora: { type: integer, description: "CLP por hora (default 1500)" }
        pricePerMinute: { type: number, description: CLP por minuto (opcional) }
        pricePerDay: { type: integer, description: CLP por día (opcional) }
        allowedVehicleTypes: { type: array, items: { type: string }, default: [car] }
        comuna: { type: string }
        descripcion: { type: string }
        direccion: { type: string }

    ActualizarEstacionamientoRequest:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [toggleActivo, updateFull], description: "Si se omite, se interpreta como actualización de occupied_spots" }
        occupied_spots: { type: integer, description: "Requerido (>= 0) si no se envía `action`" }
        nombre: { type: string }
        totalSpots: { type: integer }
        esPmr: { type: boolean }
        precioHora: { type: integer }
        pricePerMinute: { type: number }
        pricePerDay: { type: integer }
        allowedVehicleTypes: { type: array, items: { type: string } }
        photos: { type: array, items: { type: string } }
        descripcion: { type: string }
        direccion: { type: string }

    CrearReservaRequest:
      type: object
      required: [parking_id, user_id]
      properties:
        parking_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        fecha_inicio: { type: string, format: date-time, description: "Inicio de la reserva PRO. Si se omite junto con fecha_fin/duration_hours, la reserva es instantánea" }
        fecha_fin: { type: string, format: date-time, description: "Fin de la reserva PRO" }
        duration_hours: { type: number, description: "Alternativa a fecha_fin: duración en horas desde ahora (modo PRO)" }
        spot_label: { type: string, description: "Etiqueta de la plaza asignada (p.ej. 'A-12')" }

    Reserva:
      type: object
      properties:
        id: { type: string, format: uuid }
        estacionamiento_id: { type: string, format: uuid }
        conductor_id: { type: string, format: uuid }
        estado: { type: string, enum: [pendiente, confirmada, activa, completada, cancelada] }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: string, format: date-time }
        spot_label: { type: string }
        created_at: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
