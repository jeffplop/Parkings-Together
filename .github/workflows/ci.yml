name: CI

on:
  push:
    branches: ["master", "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la ejecución anterior:
# ahorra minutos de runner y siempre se valida el último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credenciales simuladas: las pruebas usan mocks y no deben tocar servicios reales.
  NEXT_PUBLIC_SUPABASE_URL: "http://mock-supabase.local"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-12345"
  SUPABASE_URL: "http://mock-supabase.local"
  SUPABASE_SERVICE_ROLE_KEY: "mock-service-key-12345"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint · Pruebas · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar dependencias
        # `npm ci` respeta package-lock.json de forma estricta: el CI compila
        # exactamente las mismas versiones que la máquina de desarrollo.
        run: npm ci

      - name: Cache de Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint (0 errores exigidos)
        run: npx eslint . --max-warnings=-1

      - name: Pruebas unitarias con cobertura
        run: npx jest --coverage --ci --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => "| " + k + " | " + t[k].pct + "% | " + t[k].covered + "/" + t[k].total + " |";
            const md = [
              "## Cobertura de pruebas", "",
              "| Métrica | % | Cubierto |", "|---|---|---|",
              row("statements"), row("branches"), row("functions"), row("lines"),
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build de las 4 aplicaciones
        run: npx turbo run build

  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar (falla ante vulnerabilidades críticas)
        # Se bloquea solo en `critical`. Las alertas altas vigentes están
        # analizadas y justificadas una a una en SECURITY.md: son de la cadena
        # de desarrollo o van dentro de Next.js, y su "arreglo" automático
        # (bajar a next@9.3.3) sería peor que el problema.
        run: npm audit --audit-level=critical

      - name: Informe de vulnerabilidades (informativo)
        if: always()
        run: |
          npm audit --json > audit.json 2>/dev/null || true
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("audit.json")) process.exit(0);
            const j = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const m = (j.metadata && j.metadata.vulnerabilities) || {};
            const rows = Object.entries(j.vulnerabilities || {}).map(
              ([n, v]) => "| " + v.severity + " | " + n + " | " + (v.isDirect ? "directa" : "transitiva") + " |"
            );
            const md = [
              "## Auditoría de dependencias", "",
              "**Total:** " + (m.total || 0) + " — críticas: " + (m.critical || 0) +
                ", altas: " + (m.high || 0) + ", moderadas: " + (m.moderate || 0) + ", bajas: " + (m.low || 0),
              "",
              rows.length ? "| Severidad | Paquete | Tipo |" : "_Sin vulnerabilidades._",
              rows.length ? "|---|---|---|" : "",
              ...rows, "",
              "> El análisis y la justificación de cada alerta vigente están en SECURITY.md.",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '

  # ───────────────────────────────────────────────────────────────────────────
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [quality, security]
    if: always()
    steps:
      - name: Verificar resultado de los trabajos previos
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::Quality Gate NO superado (lint/pruebas/build: ${{ needs.quality.result }} · seguridad: ${{ needs.security.result }})"
            exit 1
          fi
          echo "Quality Gate superado: lint sin errores, 167 pruebas en verde, build 4/4 y auditoría sin críticas."
